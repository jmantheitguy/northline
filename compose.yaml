services:
  northline:
    build: .
    container_name: northline
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NORTHLINE_DATA_DIR=/app/data
      - NORTHLINE_ADMIN_EMAIL=${NORTHLINE_ADMIN_EMAIL:?initial administrator email required}
      - NORTHLINE_ADMIN_PASSWORD=${NORTHLINE_ADMIN_PASSWORD:?initial administrator password required}
      - NORTHLINE_PUBLIC_URL=${NORTHLINE_PUBLIC_URL:-http://localhost:3000}
      - NORTHLINE_COOKIE_SECURE=${NORTHLINE_COOKIE_SECURE:-false}
      - NORTHLINE_OIDC_ISSUER=${NORTHLINE_OIDC_ISSUER:-}
      - NORTHLINE_OIDC_CLIENT_ID=${NORTHLINE_OIDC_CLIENT_ID:-}
      - NORTHLINE_OIDC_CLIENT_SECRET=${NORTHLINE_OIDC_CLIENT_SECRET:-}
      - NORTHLINE_AUTHENTIK_API_URL=${NORTHLINE_AUTHENTIK_API_URL:-}
      - NORTHLINE_AUTHENTIK_API_TOKEN=${NORTHLINE_AUTHENTIK_API_TOKEN:-}
      - NORTHLINE_DISCORD_BOT_TOKEN=${NORTHLINE_DISCORD_BOT_TOKEN:-}
      - NORTHLINE_DISCORD_GUILD_ID=${NORTHLINE_DISCORD_GUILD_ID:-}
    volumes:
      - northline-data:/app/data
volumes:
  northline-data:
