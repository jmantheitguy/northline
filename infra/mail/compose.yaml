services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: northline-stalwart
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: ${MAIL_PUBLIC_URL}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
    ports:
      - "${MAIL_BIND_ADDRESS:-127.0.0.1}:8088:8080"
    expose:
      - "25"
      - "143"
      - "587"
      - "993"
    volumes:
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    networks: [mail]

  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: northline-webmail
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "${MAIL_BIND_ADDRESS:-127.0.0.1}:8888:3000"
    volumes:
      - bulwark-config:/app/data/admin
      - bulwark-state:/app/data/admin-state
    networks: [mail]
    depends_on: [stalwart]

  mail-ingress:
    build: ./ingress
    container_name: northline-mail-ingress
    restart: unless-stopped
    environment:
      INGRESS_TOKEN: ${MAIL_INGRESS_TOKEN}
      SMTP_HOST: stalwart
      SMTP_PORT: 25
      MAIL_DOMAIN: ${MAIL_DOMAIN}
    ports:
      - "${MAIL_BIND_ADDRESS:-127.0.0.1}:8788:8788"
    networks: [mail]
    depends_on: [stalwart]

networks:
  mail:
    name: northline-mail

volumes:
  stalwart-config:
  stalwart-data:
  bulwark-config:
  bulwark-state:
