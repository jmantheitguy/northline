name: Northline CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NORTHLINE_ADMIN_EMAIL: build@example.invalid
          NORTHLINE_ADMIN_PASSWORD: build-only-password
      - run: npm run security:scan
      - run: bash ops/release/verify-clean-install.sh
