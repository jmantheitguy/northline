name: Feature request
description: Suggest an improvement that supports Northline's product direction.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the workflow or user need before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe how you imagine the feature working.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options: [Boards and tasks, Collaboration, Administration, Identity and permissions, Discord and reminders, Deployment and operations, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap check
      options:
        - label: I reviewed the public roadmap before submitting this request.
          required: true
